<h1 class="visually-hidden">Photo</h1>

<figure class="photo-detail">
  @if (!isImageLoaded()) {
    <div class="photo-detail__loader" role="status" aria-label="Loading photo">
      <mat-progress-spinner mode="indeterminate" [diameter]="40" />
    </div>
  }
  <img
    class="photo-detail__image"
    [class.photo-detail__image--hidden]="!isImageLoaded()"
    [src]="imageUrl()"
    [alt]="'Photo ' + id()"
    (load)="isImageLoaded.set(true)"
  />
</figure>

<div class="photo-detail__actions">
  @if (isFavorite()) {
    <button matButton="filled" type="button" (click)="removeFromFavorites()">
      Remove from favorites
    </button>
  } @else {
    <p class="photo-detail__note">This photo is not in your favorites.</p>
  }
</div>
