<button
  type="button"
  class="photo-card"
  [attr.aria-label]="actionLabel()"
  (click)="selected.emit(photo())"
>
  <!-- The button carries the accessible name; the image is decorative. -->
  <img
    class="photo-card__image"
    [src]="imageUrl()"
    alt=""
    width="200"
    height="300"
    loading="lazy"
  />
</button>
